<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter PIN</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(to bottom right, #1e3a8a, #2a4dbf);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      color: #1f2937;
    }

    .header {
      width: 100%;
      max-width: 700px;
      padding: 30px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
    }

    .header .logo {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header .logo::before {
      content: '✏️';
      font-size: 18px;
    }

    .header a {
      color: white;
      text-decoration: none;
      font-size: 15px;
    }

    .header a:hover {
      text-decoration: underline;
    }

    .card {
      background-color: #f9fafb;
      margin-top: 20px;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lock-icon {
      width: 60px;
      height: 60px;
      background: #e0edff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 26px;
      color: #2563eb;
    }

    h2 {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #111827;
    }

    p.subtext {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    form label {
      display: block;
      text-align: left;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 14px 44px 14px 14px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .eye-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #6b7280;
      font-size: 18px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #444;
      gap: 6px;
      margin-bottom: 20px;
      justify-content: center;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    /* Optional floating circles for background effect */
    .circle {
      position: absolute;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.05);
      z-index: 0;
    }

    .circle1 {
      width: 200px;
      height: 200px;
      top: 80px;
      left: 30px;
    }

    .circle2 {
      width: 150px;
      height: 150px;
      bottom: 60px;
      right: 40px;
    }
  </style>
</head>
<body>
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>

  <div class="header">
    <div class="logo">SecuraNote</div>
    <a href="{{ url_for('notes.dashboard') }}">← Back to Dashboard</a>
  </div>

  <div class="card">
    <div class="lock-icon">🔒</div>
    <h2>Create PIN to Edit Note</h2>
    <p class="subtext">Please enter your secure PIN to edit this note</p>

    <form method="POST">
      <label for="pin">PIN</label>
      <div class="input-wrapper">
        <input id="pin" name="pin" type="password" placeholder="Enter 4-digit PIN" minlength="4" maxlength="6" required>
        <span class="eye-icon" onclick="togglePin()">👁️</span>
      </div>

      <div class="checkbox-wrapper">
        <input type="checkbox" id="showPin" onclick="togglePin()"> <label for="showPin">Show PIN</label>
      </div>

      <button type="submit">Verify PIN</button>
    </form>
  </div>

  <script>
    function togglePin() {
      const pin = document.getElementById("pin");
      pin.type = pin.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
