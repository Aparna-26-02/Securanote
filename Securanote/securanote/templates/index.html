<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecuraNote</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      background-color: #fff;
      color: #0e1128;
      background-image: radial-gradient(#000 1px, transparent 1px);
      background-size: 20px 20px;
      cursor: none;
      scroll-behavior: smooth;
    }

    .custom-cursor {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff6c0e;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      transition: transform 0.1s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 3rem;
      background-color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
    }

    nav a {
      margin: 0 0.5rem;
      text-decoration: none;
      color: #0e1128;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    nav a[href^="#"] {
      scroll-behavior: smooth;
    }

    .btn {
      padding: 0.6rem 1.6rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-primary {
      background-color: #ff6c0e;
      color: white;
      border: none;
    }

    .btn-outline {
      border: 2px solid #ff6c0e;
      color: #ff6c0e;
      background: transparent;
    }

    .hero {
      padding: 5rem 3rem;
      background: #ffffff;
      position: relative;
    }

    .solar-animation {
      position: absolute;
      right: 10%;
      top: 20%;
      width: 150px;
      height: 150px;
      border: 2px dotted #ccc;
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }

    .solar-animation::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 20px;
      height: 20px;
      background: #ff6c0e;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hero h1 {
      font-size: 60px;
      font-weight: 700;
      color: #0e1128;
      line-height: 1.1;
      margin: 0;
    }

    .hero span {
      background: linear-gradient(to right, #f57c00, #8bc34a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      margin-top: 1.2rem;
      font-size: 18px;
      color: #3a3f58;
    }

    .buttons {
      margin-top: 2.5rem;
    }

    section {
      padding: 5rem 3rem;
    }

    .section-title {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    .section-subtitle {
      text-align: center;
      margin-bottom: 3rem;
      font-size: 16px;
      color: #555;
    }

    .feature-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .feature-box {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      width: 300px;
    }

    .feature-box h3 {
      color: #ff6c0e;
      margin-bottom: 1rem;
    }

    .section.blue {
      background: linear-gradient(135deg, #002766, #004080);
      color: white;
    }

    .testimonial {
      background-color: #003366;
      padding: 3rem;
      color: white;
      border-radius: 8px;
      max-width: 700px;
      margin: 2rem auto;
      text-align: center;
    }

    .team-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
    }

    .team-member {
      text-align: center;
      max-width: 200px;
    }

    .team-member img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #ff6c0e;
    }

    .footer {
      background: #0e1128;
      color: white;
      padding: 2rem;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 36px;
      }
      .solar-animation {
        display: none;
      }
      .feature-box {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="custom-cursor" id="customCursor"></div>

  <header>
    <div class="logo"><strong>SECURANOTE</strong></div>
    <nav>
      <a href="#features">Features</a>
      <a href="#security">Security</a>
      <a href="#pricing">Pricing</a>
      <a href="#about">About</a>
      <a href="login.html">Login</a>
      <a href="register.html" class="btn btn-primary">Get Started</a>
    </nav>
  </header>

  <!-- Hero and other sections remain unchanged -->

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init();
    const cursor = document.getElementById('customCursor');
    document.addEventListener('mousemove', e => {
      cursor.style.top = e.clientY + 'px';
      cursor.style.left = e.clientX + 'px';
    });
  </script>
</body>
</html>
