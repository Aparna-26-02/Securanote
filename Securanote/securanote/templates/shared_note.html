<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ note.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-600 min-h-screen text-gray-800 p-4 flex items-center justify-center">
    <div class="bg-white/90 backdrop-blur shadow-xl rounded-2xl p-6 max-w-2xl w-full fade-in">

        <!-- Note Title -->
        <h2 class="text-2xl font-bold text-blue-700 border-b pb-2 mb-4">{{ note.title }}</h2>

        <!-- Note Content -->
        <pre class="whitespace-pre-wrap text-gray-800 text-sm leading-relaxed bg-blue-50 p-4 rounded-md border border-blue-100">{{ decrypted }}</pre>

        <!-- Attached File -->
        {% if file_url %}
            <div class="mt-6">
                <h3 class="text-lg font-semibold text-blue-700 mb-2">📎 Attachment:</h3>

                {% if file_ext in ['jpg', 'jpeg', 'png', 'gif'] %}
                    <img src="{{ file_url }}" alt="Attached image" class="rounded shadow-md max-w-full max-h-[400px] object-contain mx-auto">
                {% elif file_ext == 'mp3' %}
                    <audio controls preload="none" class="w-full mt-2">
                        <source src="{{ file_url }}" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                {% elif file_ext in ['mp4', 'webm', 'ogg'] %}
                    <video controls preload="metadata" class="w-full rounded-md shadow mt-2 max-h-[400px]">
                        <source src="{{ file_url }}" type="video/{{ file_ext }}">
                        Your browser does not support the video tag.
                    </video>
                {% else %}
                    <a href="{{ file_url }}" target="_blank" class="inline-block text-blue-600 hover:text-blue-800 underline mt-2">Download File</a>
                {% endif %}
            </div>
        {% endif %}

    </div>
</body>
</html>
