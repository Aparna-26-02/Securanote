<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify PIN to Edit Note</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: #f9fafb;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease-out;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .logo::before {
            content: "✏️";
            margin-right: 8px;
        }

        .back {
            color: white;
            position: absolute;
            top: 20px;
            right: 20px;
            text-decoration: none;
            font-size: 14px;
        }

        .icon-lock {
            background-color: #e0e7ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-lock::before {
            content: "🔒";
            font-size: 24px;
        }

        h2 {
            font-size: 20px;
            color: #111827;
            margin-bottom: 6px;
        }

        .subtext {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 14px 40px 14px 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #c7d2fe;
            outline: none;
            background-color: #fff;
            color: #374151;
        }

        .eye-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #6b7280;
        }

        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            font-weight: 600;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 14px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .show-pin {
            font-size: 14px;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .show-pin input {
            margin-right: 6px;
        }

        .message-error {
            color: #dc2626;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .message-info {
            color: #2563eb;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="logo">SecuraNote</div>
<a href="{{ url_for('notes.dashboard') }}" class="back">← Back to Dashboard</a>

<div class="container">
    <div class="icon-lock"></div>
    <h2>Create PIN to Edit Note</h2>
    <div class="subtext">Please enter your secure PIN to edit this note</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="message-{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="pin">PIN</label>
        <div class="input-wrapper">
            <input type="password" name="pin" id="pin" minlength="4" maxlength="6" placeholder="Enter 4-digit PIN" required>
            <span class="eye-icon" onclick="togglePin()">👁️</span>
        </div>

        <button type="submit">Verify PIN</button>

        <div class="show-pin">
            <input type="checkbox" onclick="togglePin()"> Show PIN
        </div>
    </form>
</div>

<script>
function togglePin() {
    var x = document.getElementById("pin");
    if (x.type === "password") {
        x.type = "text";
    } else {
        x.type = "password";
    }
}
</script>

</body>
</html>
