<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Note</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(to bottom right, #1e3a8a, #2a4dbf);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
        }

        .container {
            background-color: #f9fafb;
            margin-top: 60px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 24px;
            color: #111827;
        }

        label {
            font-weight: 600;
            display: block;
            margin: 16px 0 6px;
            color: #374151;
        }

        input[type="text"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: border 0.2s;
            background-color: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        #pin-field {
            margin-top: 10px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background-color: #2563eb;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            margin-top: 10px;
        }

        .checkbox-wrapper input {
            margin: 0;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Note</h2>

        <form method="POST">
            <label for="title">Title:</label>
            <input id="title" name="title" value="{{ note.title }}" required>

            <label for="content">Content:</label>
            <textarea id="content" name="content" required>{{ decrypted }}</textarea>

            <label for="encryption_type">Encryption Type:</label>
            <select id="encryption_type" name="encryption_type" required>
                <option value="AES" {% if note.encryption_type == 'AES' %}selected{% endif %}>AES</option>
                <option value="ChaCha" {% if note.encryption_type == 'ChaCha' %}selected{% endif %}>ChaCha</option>
            </select>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="change-pin-toggle" onchange="togglePin()"> 
                <label for="change-pin-toggle">Change PIN</label>
            </div>

            <div id="pin-field" style="display: none;">
                <label for="pin">New 4-digit PIN:</label>
                <input id="pin" type="password" name="pin" minlength="4" maxlength="6">
            </div>

            <button type="submit">Save Changes</button>
        </form>
    </div>

    <a class="back-link" href="{{ url_for('notes.dashboard') }}">← Back to Dashboard</a>

    <script>
        function togglePin() {
            const pinField = document.getElementById("pin-field");
            pinField.style.display = pinField.style.display === "none" ? "block" : "none";
        }
    </script>
</body>
</html>
