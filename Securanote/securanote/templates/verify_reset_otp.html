<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuraNote - Verify OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .verify-card {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-primary {
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-secondary {
            transition: all 0.3s ease;
        }
        .btn-secondary:not(:disabled):hover {
            background-color: rgba(79, 70, 229, 0.1);
        }
        .otp-input {
            width: 2.5rem;
            height: 2.5rem;
            font-size: 1.25rem;
            text-align: center;
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
            transition: all 0.2s;
        }
        .otp-input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
            outline: none;
        }
        @media (max-width: 640px) {
            .otp-input {
                width: 2rem;
                height: 2rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="verify-card bg-white rounded-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Verify Your Identity</h1>
            <p class="text-gray-600 mt-2">Enter the verification code sent to your email</p>
            <p class="text-indigo-600 font-medium mt-1" id="userEmail">user@securanote.com</p>
        </div>

        <!-- Modified form with 6 boxes but keeping your original form structure -->
        <form method="POST" action="{{ url_for('auth.verify_reset_otp') }}" class="space-y-6">
            <div class="space-y-2">
                <p class="block text-sm font-medium text-gray-700">Enter OTP:</p>
                
                <!-- 6 box OTP input -->
                <div class="flex justify-between space-x-2">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                </div>
                
                <!-- Hidden field to store the combined OTP value -->
                <input type="hidden" name="otp" id="otpValue">
            </div>

            <input 
                type="submit" 
                value="Verify OTP"
                class="btn-primary w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 cursor-pointer"
            >
        </form>

        <!-- Your original resend form with styling -->
        <form method="POST" action="{{ url_for('auth.resend_reset_otp') }}" class="mt-6">
            <button 
                type="submit" 
                id="resendBtn" 
                disabled
                class="btn-secondary w-full py-2 rounded-lg font-medium text-indigo-600 border border-indigo-200 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Resend OTP (10s)
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="#" class="text-gray-600 text-sm hover:underline focus:outline-none">
                Back to Login
            </a>
        </div>

        <!-- Notification for demo purposes -->
        <div id="notification" class="fixed top-4 right-4 bg-white rounded-lg shadow-lg p-4 transform translate-x-full transition-transform duration-300 max-w-xs">
            <div class="flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p id="notificationText" class="text-gray-700"></p>
            </div>
        </div>
    </div>

    <script>
        // Your exact script logic preserved
        let countdown = 10;
        const btn = document.getElementById('resendBtn');
        const interval = setInterval(() => {
            if (countdown > 0) {
                btn.innerText = `Resend OTP (${countdown}s)`;
                countdown--;
            } else {
                btn.innerText = "Resend OTP";
                btn.disabled = false;
                clearInterval(interval);
            }
        }, 1000);

        // OTP input handling
        const otpInputs = document.querySelectorAll('.otp-input');
        const otpValue = document.getElementById('otpValue');
        
        // Auto-focus the first input on page load
        setTimeout(() => otpInputs[0].focus(), 500);
        
        otpInputs.forEach((input, index) => {
            // Handle input
            input.addEventListener('input', (e) => {
                // Only allow numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                // Auto-focus next input
                if (e.target.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                
                // Update the hidden field with combined OTP value
                updateOtpValue();
            });
            
            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').trim();
                
                if (/^\d+$/.test(pasteData)) {
                    const digits = pasteData.split('');
                    
                    otpInputs.forEach((input, i) => {
                        if (digits[i]) {
                            input.value = digits[i];
                            
                            // Focus the next empty input or the last one
                            if (i < otpInputs.length - 1 && digits[i + 1]) {
                                otpInputs[i + 1].focus();
                            } else {
                                input.focus();
                            }
                        }
                    });
                    
                    updateOtpValue();
                }
            });
        });
        
        // Update the hidden OTP field with combined value
        function updateOtpValue() {
            otpValue.value = Array.from(otpInputs).map(input => input.value).join('');
        }

        // Demo functionality for form submissions
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // For the OTP form, ensure the hidden field is updated
                if (form.querySelector('.otp-input')) {
                    updateOtpValue();
                }
                
                // Show notification
                const notification = document.getElementById('notification');
                const notificationText = document.getElementById('notificationText');
                
                if (form.querySelector('#otpValue')) {
                    notificationText.textContent = "Verifying OTP...";
                } else {
                    notificationText.textContent = "Resending OTP...";
                    // Reset the countdown if resend button is clicked
                    if (!btn.disabled) {
                        countdown = 10;
                        btn.disabled = true;
                        btn.innerText = `Resend OTP (${countdown}s)`;
                        clearInterval(interval);
                        const newInterval = setInterval(() => {
                            if (countdown > 0) {
                                btn.innerText = `Resend OTP (${countdown}s)`;
                                countdown--;
                            } else {
                                btn.innerText = "Resend OTP";
                                btn.disabled = false;
                                clearInterval(newInterval);
                            }
                        }, 1000);
                    }
                }
                
                notification.classList.remove('translate-x-full');
                notification.classList.add('translate-x-0');
                
                setTimeout(() => {
                    notification.classList.remove('translate-x-0');
                    notification.classList.add('translate-x-full');
                    
                    // In a real app, this would submit the form
                    if (form.querySelector('#otpValue')) {
                        setTimeout(() => {
                            alert('OTP verification submitted! The OTP value is: ' + otpValue.value);
                        }, 500);
                    }
                }, 2000);
            });
        });
    </script>
