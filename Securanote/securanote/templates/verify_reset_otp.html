<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SecuraNote - Verify OTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .verify-card {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-primary {
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .otp-input {
      width: 3rem;
      height: 3rem;
      font-size: 1.5rem;
      text-align: center;
      border-radius: 0.5rem;
      border: 1px solid #d1d5db;
      transition: all 0.2s;
    }
    .otp-input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
      outline: none;
    }
    @media (max-width: 640px) {
      .otp-input {
        width: 2.5rem;
        height: 2.5rem;
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="verify-card bg-white rounded-xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Verify Your Identity</h1>
      <p class="text-gray-600 mt-2">Enter the 6-digit code sent to your email</p>
      <p class="text-indigo-600 font-medium mt-1" id="userEmail">user@example.com</p>
    </div>

    <form id="otpForm" class="space-y-6">
      <div class="space-y-4">
        <div class="flex justify-center space-x-2 sm:space-x-4">
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
        </div>
        <p id="otpError" class="text-red-500 text-sm text-center hidden">Invalid verification code. Please try again.</p>
        <div class="flex justify-center">
          <div id="countdown" class="text-sm text-gray-600">Code expires in <span id="timer" class="font-medium">05:00</span></div>
        </div>
      </div>

      <button type="submit" id="verifyButton" class="btn-primary w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
        Verify Code
      </button>

      <div class="text-center space-y-3">
        <p class="text-sm text-gray-600">Didn't receive the code?</p>
        <button type="button" id="resendButton" class="text-indigo-600 font-medium hover:underline focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed" disabled>
          Resend Code (<span id="resendTimer">30</span>s)
        </button>
        <div class="pt-2">
          <button type="button" id="backButton" class="text-gray-600 text-sm hover:underline focus:outline-none">
            Back to Login
          </button>
        </div>
      </div>
    </form>

    <!-- Notification -->
    <div id="notification" class="fixed top-4 right-4 bg-white rounded-lg shadow-lg p-4 transform translate-x-full transition-transform duration-300 max-w-xs">
      <div class="flex items-center">
        <svg id="notificationIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"></svg>
        <p id="notificationText" class="text-gray-700"></p>
      </div>
    </div>
  </div>

  <script>
    const otpInputs = document.querySelectorAll('.otp-input');
    const otpForm = document.getElementById('otpForm');
    const otpError = document.getElementById('otpError');
    const timerElement = document.getElementById('timer');
    const resendButton = document.getElementById('resendButton');
    const resendTimerElement = document.getElementById('resendTimer');
    const backButton = document.getElementById('backButton');
    const notification = document.getElementById('notification');
    const notificationText = document.getElementById('notificationText');
    const notificationIcon = document.getElementById('notificationIcon');
    const userEmailElement = document.getElementById('userEmail');

    userEmailElement.textContent = "user@securanote.com";

    // Focus logic
    otpInputs.forEach((input, index) => {
      if (index === 0) setTimeout(() => input.focus(), 500);

      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
        if (e.target.value && index < otpInputs.length - 1) otpInputs[index + 1].focus();
        otpError.classList.add('hidden');
        checkAllFilled();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) otpInputs[index - 1].focus();
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = e.clipboardData.getData('text').trim();
        if (/^\d+$/.test(pasteData)) {
          const digits = pasteData.split('');
          otpInputs.forEach((input, i) => {
            input.value = digits[i] || '';
          });
          checkAllFilled();
        }
      });
    });

    function checkAllFilled() {
      const allFilled = Array.from(otpInputs).every(input => input.value.length === 1);
      if (allFilled) setTimeout(() => otpForm.dispatchEvent(new Event('submit')), 500);
    }

    otpForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const otpValue = Array.from(otpInputs).map(input => input.value).join('');
      if (otpValue === '123456') {
        showNotification('Verification successful!', 'success');
        setTimeout(() => {
          window.location.href = '#reset-password';
        }, 1500);
      } else {
        otpError.classList.remove('hidden');
        otpInputs.forEach(input => input.value = '');
        otpInputs[0].focus();
      }
    });

    // OTP expiration timer
    let timeLeft = 300;
    let timerInterval;

    function startOtpTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerElement.textContent = '00:00';
          timerElement.classList.add('text-red-500');
          showNotification('Verification code has expired. Please request a new one.', 'error');
        } else {
          const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
          const s = String(timeLeft % 60).padStart(2, '0');
          timerElement.textContent = `${m}:${s}`;
          timeLeft--;
        }
      }, 1000);
    }
    startOtpTimer();

    // Resend timer
    let resendTimeLeft = 30;
    let resendTimerInterval;

    function startResendTimer() {
      clearInterval(resendTimerInterval);
      resendButton.disabled = true;
      resendTimeLeft = 30;
      resendTimerInterval = setInterval(() => {
        resendTimeLeft--;
        resendTimerElement.textContent = resendTimeLeft;
        if (resendTimeLeft <= 0) {
          clearInterval(resendTimerInterval);
          resendButton.disabled = false;
          resendButton.textContent = 'Resend Code';
        }
      }, 1000);
    }
    startResendTimer();

    resendButton.addEventListener('click', () => {
      otpInputs.forEach(input => input.value = '');
      otpInputs[0].focus();
      otpError.classList.add('hidden');
      timeLeft = 300;
      timerElement.classList.remove('text-red-500');
      startOtpTimer();
      resendButton.textContent = `Resend Code (${resendTimeLeft}s)`;
      startResendTimer();
      showNotification('New verification code sent!', 'success');
    });

    backButton.addEventListener('click', () => {
      showNotification('Redirecting to login...', 'info');
      setTimeout(() => {
        window.location.href = '#login';
      }, 1000);
    });

    function showNotification(message, type = 'success') {
      notificationText.textContent = message;
      if (type === 'error') {
        notificationIcon.className = "h-6 w-6 mr-2 text-red-500";
        notificationIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
      } else if (type === 'info') {
        notificationIcon.className = "h-6 w-6 mr-2 text-blue-500";
        notificationIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
      } else {
        notificationIcon.className = "h-6 w-6 mr-2 text-green-500";
        notificationIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />';
      }
      notification.classList.remove('translate-x-full');
      notification.classList.add('translate-x-0');
      setTimeout(() => {
        notification.classList.remove('translate-x-0');
        notification.classList.add('translate-x-full');
      }, 3000);
    }

    setTimeout(() => {
      showNotification('Verification code sent to your email', 'info');
    }, 1000);
  </script>
</body>
</html>
