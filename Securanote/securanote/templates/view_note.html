<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecuraNote - Edit Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a237e, #283593);
            min-height: 100vh;
        }
        .note-container {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border-radius: 16px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3949ab, #5c6bc0);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #303f9f, #3f51b5);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #78909c, #90a4ae);
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, #607d8b, #78909c);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="p-4 md:p-6 font-sans text-gray-800">
    <div class="max-w-3xl mx-auto note-container p-6 md:p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-indigo-900">Edit Note</h1>
            <a href="{{ url_for('notes.dashboard') }}" class="btn-secondary px-4 py-2 rounded-lg text-white font-medium flex items-center">
                ← Back to Dashboard
            </a>
        </div>

        <form method="POST" class="space-y-6">
            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                <input type="text" name="title" value="{{ note.title }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" />
            </div>

            <!-- Content -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Content</label>
                <textarea name="content" rows="8" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">{{ decrypted }}</textarea>
            </div>

            <!-- Encryption Method -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Encryption Type</label>
                <select name="encryption_type" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <option value="AES" {% if note.encryption_type == 'AES' %}selected{% endif %}>AES</option>
                    <option value="ChaCha" {% if note.encryption_type == 'ChaCha' %}selected{% endif %}>ChaCha</option>
                </select>
            </div>

            <!-- Toggle PIN -->
            <div>
                <label class="inline-flex items-center">
                    <input type="checkbox" id="change-pin-toggle" onchange="togglePin()" class="mr-2">
                    <span class="text-indigo-700 font-medium">Change PIN</span>
                </label>
            </div>

            <!-- New PIN Field -->
            <div id="pin-field" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1 mt-4">New 4-digit PIN</label>
                <input type="password" name="pin" minlength="4" maxlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" />
            </div>

            <!-- Submit -->
            <div class="pt-4">
                <button type="submit" class="btn-primary px-6 py-3 rounded-lg text-white font-medium w-full md:w-auto">Save Changes</button>
            </div>
        </form>
    </div>

    <script>
        function togglePin() {
            const pinField = document.getElementById('pin-field');
            pinField.classList.toggle('hidden');
        }
    </script>
</body>
</html>
